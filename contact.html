<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - CivicBridge</title>
<meta name="description" content="Contact-form prototype for the fictional CivicBridge course project.">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<nav class="bg-pink-700">
  <div class="max-w-6xl mx-auto px-4 py-2 flex flex-col md:flex-row justify-between items-center gap-3">

    <!-- Logo + Slogan -->
    <div class="flex items-center space-x-4">
      <img src="logo2.png" alt="CivicBridge Logo" class="h-20 w-auto">
      <span class="text-white font-semibold text-lg">
        Bridging Tech & Community
      </span>
    </div>

    <!-- Navigation Links -->
    <div class="flex flex-wrap justify-center gap-x-6 gap-y-2 pb-3 md:pb-0 font-bold text-white text-base md:text-xl">
      <a href="index.html" class="hover:text-gray-200">Home</a>
      <a href="services.html" class="hover:text-gray-200">Services</a>
      <a href="about.html" class="hover:text-gray-200">About</a>
      <a href="contact.html" class="hover:text-gray-200">Contact</a>
    </div>

  </div>
</nav>

<section class="max-w-xl mx-auto py-16 px-6">

<h2 class="text-3xl font-bold text-center mb-10 text-pink-500">Contact Us</h2>

<p class="text-center text-gray-600 mb-6">This form is a visual prototype and does not send or store messages.</p>

<form id="contactForm" class="space-y-4 bg-white p-8 rounded-lg shadow">

<label for="name" class="block font-medium text-gray-700">Name</label>
<input
id="name"
name="name"
type="text"
placeholder="Your Name"
autocomplete="name"
class="w-full border p-3 rounded"
required
>

<label for="email" class="block font-medium text-gray-700">Email</label>
<input
id="email"
name="email"
type="email"
placeholder="Your Email"
autocomplete="email"
class="w-full border p-3 rounded"
required
>

<label for="message" class="block font-medium text-gray-700">Message</label>
<textarea
id="message"
name="message"
placeholder="Your Message"
rows="5"
class="w-full border p-3 rounded"
required
></textarea>

<button
class="w-full bg-pink-600 text-white py-3 rounded-lg hover:bg-pink-700 font-semibold"
type="submit"
>
Send Message
</button>

</form>

</section>

<footer class="text-center py-6 px-4 text-gray-500">
&copy; 2026 CivicBridge Solutions &mdash; Academic prototype
</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){
e.preventDefault();
alert("Demo only: no message was sent or stored.");
});
</script>

</body>
</html>
